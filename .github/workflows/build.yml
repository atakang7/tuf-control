name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Build
        run: dotnet build src/TufControl.csproj -c Release

      - name: Publish
        run: dotnet publish src/TufControl.csproj -c Release --no-restore --self-contained false -o publish

      - name: Package
        shell: pwsh
        run: |
          Copy-Item Install.ps1, Uninstall.ps1, LICENSE, THIRD-PARTY-NOTICES.md publish/
          Remove-Item publish/*.pdb
          Compress-Archive publish/* TufControl-win-x64.zip
          (Get-FileHash TufControl-win-x64.zip -Algorithm SHA256).Hash | Out-File TufControl-win-x64.zip.sha256 -Encoding ascii

      - uses: actions/upload-artifact@v4
        with:
          name: TufControl-win-x64
          path: |
            TufControl-win-x64.zip
            TufControl-win-x64.zip.sha256

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: TufControl-win-x64

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            TufControl-win-x64.zip
            TufControl-win-x64.zip.sha256
          generate_release_notes: true
