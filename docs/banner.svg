<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-label="TUF Control: open-source fan, power and GPU control for ASUS TUF laptops">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07080b"/>
      <stop offset="1" stop-color="#14161c"/>
    </linearGradient>
    <linearGradient id="fill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff2d55" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ff2d55" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.35" r="0.55">
      <stop offset="0" stop-color="#ff2d55" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#ff2d55" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.04"/>
    </pattern>
  </defs>
  <rect width="1280" height="400" rx="18" fill="url(#bg)"/>
  <rect width="1280" height="400" rx="18" fill="url(#grid)"/>
  <rect width="1280" height="400" rx="18" fill="url(#glow)"/>

  <!-- logo mark -->
  <g transform="translate(80 92)">
    <path d="M0 0H64L56 14H40V64H24V14H8Z" fill="#f4f4f6"/>
  </g>

  <text x="166" y="140" fill="#f4f4f6" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="64" font-weight="700" letter-spacing="-1">TUF Control</text>
  <text x="82" y="204" fill="#b9bcc6" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="26">Fan curves, power limits and GPU modes for ASUS TUF laptops.</text>
  <text x="82" y="242" fill="#b9bcc6" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="26">Tiny, open source, and it verifies what it writes.</text>

  <!-- chips -->
  <g font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="17" font-weight="600">
    <rect x="82" y="290" width="150" height="40" rx="20" fill="#ff2d55" fill-opacity="0.14" stroke="#ff2d55" stroke-opacity="0.6"/>
    <text x="157" y="316" fill="#ff8aa1" text-anchor="middle">Fan curves</text>
    <rect x="246" y="290" width="170" height="40" rx="20" fill="#3b82f6" fill-opacity="0.14" stroke="#3b82f6" stroke-opacity="0.6"/>
    <text x="331" y="316" fill="#93c5fd" text-anchor="middle">CPU / GPU power</text>
    <rect x="430" y="290" width="150" height="40" rx="20" fill="#22c55e" fill-opacity="0.14" stroke="#22c55e" stroke-opacity="0.6"/>
    <text x="505" y="316" fill="#86efac" text-anchor="middle">Eco GPU mode</text>
    <rect x="594" y="290" width="150" height="40" rx="20" fill="#a855f7" fill-opacity="0.14" stroke="#a855f7" stroke-opacity="0.6"/>
    <text x="669" y="316" fill="#d8b4fe" text-anchor="middle">Temp targets</text>
  </g>

  <!-- fan curve card -->
  <g transform="translate(830 70)">
    <rect width="380" height="260" rx="14" fill="#0d0f14" stroke="#ffffff" stroke-opacity="0.08"/>
    <text x="24" y="38" fill="#f4f4f6" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="17" font-weight="600">CPU fan curve</text>
    <text x="356" y="38" fill="#7b7f8c" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="14" text-anchor="end">8-point · protected</text>
    <g stroke="#ffffff" stroke-opacity="0.06">
      <path d="M24 80H356M24 125H356M24 170H356M24 215H356"/>
    </g>
    <path d="M24 205L80 205L130 200L180 196L222 160L262 112L300 92L356 82V230H24Z" fill="url(#fill)"/>
    <path d="M24 205L80 205L130 200L180 196L222 160L262 112L300 92L356 82" fill="none" stroke="#ff2d55" stroke-width="3" stroke-linejoin="round"/>
    <g fill="#0d0f14" stroke="#ff2d55" stroke-width="3">
      <circle cx="80" cy="205" r="5"/><circle cx="130" cy="200" r="5"/><circle cx="180" cy="196" r="5"/>
      <circle cx="222" cy="160" r="5"/><circle cx="262" cy="112" r="5"/><circle cx="300" cy="92" r="5"/>
    </g>
    <text x="24" y="250" fill="#7b7f8c" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="13">20 °C</text>
    <text x="356" y="250" fill="#7b7f8c" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="13" text-anchor="end">100 °C</text>
  </g>
</svg>
